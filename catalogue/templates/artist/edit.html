{% extends 'layouts/base.html' %}

{% block title %}Modifier un artiste{% endblock %}

{% block content %}
<section class="form-page">
    <h1>Modifier un artiste</h1>
    <form action="{% url 'catalogue:artist-edit' artist.id %}" method="post" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="button button-primary" type="submit">Enregistrer</button>
            <a class="button" href="{% url 'catalogue:artist-show' artist.id %}">Annuler</a>
        </div>
    </form>
</section>
{% endblock %}
