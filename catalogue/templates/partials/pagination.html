{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="button" href="?{{ pagination_query }}&page={{ page_obj.previous_page_number }}">Precedent</a>
    {% endif %}

    <span>Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
        <a class="button" href="?{{ pagination_query }}&page={{ page_obj.next_page_number }}">Suivant</a>
    {% endif %}
</nav>
{% endif %}
